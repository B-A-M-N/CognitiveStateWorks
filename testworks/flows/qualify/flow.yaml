id: testworks.qualify
statework: testworks
kind: internal_flow
version: 1.0.0
purpose: Establish whether actual executed assurance is sufficient for the exact subject and declared
  scope.
inputs:
- strategy and risk
- selection
- host-attested results
- subject/environment fingerprints
- release requirements
outputs:
- qualification or sufficiency guard evidence
- testing_evidence_packet
- explicit residual risks and conditions
prohibitions:
- Green from another subject
- Untrusted execution claims
- Any unresolved required failing gate
- Critical omitted gate without approved scope exception
handoff_rule: Release and deployment decisions remain with downstream authorized owners.
