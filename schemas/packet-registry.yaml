# Typed handoff packet registry: every packet type, its schema, producer,
# and known consumers. The runtime resolver routes missing required consumed
# packets through this table (producer chain) instead of hard-coding
# StateWork names.
version: 1.1.0
packets:
  repository_truth_packet:
    schema: repository-truth-packet.schema.json
    schema_version: "1.1.0"
    producer: gitter
    consumers: [getter, testworks]
    freshness:
      strategy: trusted_validator
      validator_id: repository_truth_v1
    required_any_context: [repository_path, repository_freshness]
  repository_evidence_packet:
    schema: repository-evidence-packet.schema.json
    schema_version: "1.1.0"
    producer: getter
    consumers: []
    freshness: immutable
  infrastructure_truth_packet:
    schema: infrastructure-truth-packet.schema.json
    schema_version: "1.1.0"
    producer: infrae
    consumers: [infrae, testworks]
    freshness:
      strategy: exact_context
      packet_path: payload.freshness_fingerprint
      context_path: infrastructure_fingerprint
    required_context: [infrastructure_fingerprint]
  infrastructure_evidence_packet:
    schema: infrastructure-evidence-packet.schema.json
    schema_version: "1.1.0"
    producer: infrae
    consumers: []
    freshness: immutable
  tui_validation_packet:
    schema: tui-validation-packet.schema.json
    schema_version: "1.1.0"
    producer: tuid
    consumers: []
    freshness:
      strategy: exact_context
      packet_path: payload.freshness_fingerprint
      context_path: validation_fingerprint
    required_context: [validation_fingerprint]
  godkiller_boundary_packet:
    schema: godkiller_boundary_packet.schema.json
    schema_version: 1.0.0
    producer: godkiller
    consumers: [terraformer, testworks]
    freshness:
      strategy: exact_context
      packet_path: payload.architecture_fingerprint
      context_path: architecture_fingerprint
    required_context:
    - architecture_fingerprint
  terraformer_integration_packet:
    schema: terraformer_integration_packet.schema.json
    schema_version: 1.0.0
    producer: terraformer
    consumers: [testworks]
    freshness:
      strategy: exact_context
      packet_path: payload.composition_fingerprint
      context_path: composition_fingerprint
    required_context:
    - composition_fingerprint
  testing_evidence_packet:
    schema: testing-evidence-packet.schema.json
    schema_version: '1.0.0'
    producer: testworks
    consumers: []
    freshness:
      strategy: exact_context
      packet_path: payload.subject.fingerprint
      context_path: testing_fingerprint
    required_context: [testing_fingerprint]
