  - architectural recomposition
  - component integration
  - contract reconciliation
  - lifecycle composition
  - integration gaps
  secondary:
  - distributed component wiring
  - ownership conflict
  - component compatibility
  - partial integration
phase_tags:
- domain_state
- architecture
behavior_tags:
- diagnose
- implementation
- verification
- recovery
inputs:
