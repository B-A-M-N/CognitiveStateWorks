version: 1.0.0
packets:
  repository_truth_packet:
    schema: contracts/schemas/repository-truth-packet.schema.json
    schema_version: 1.1.0
    producer: gitter
    consumers:
    - getter
    - testworks
    freshness:
      strategy: trusted_validator
      validator_id: repository_truth_v1
    required_any_context:
    - repository_path
    - repository_freshness
