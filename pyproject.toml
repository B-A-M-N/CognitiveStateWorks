[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-statework"
version = "1.0.0"
description = "Typed StateWork transition and handoff control plane"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["jsonschema>=4.18", "PyYAML>=6.0"]

[tool.setuptools]
packages = ["cognitive_statework"]
package-dir = {cognitive_statework = "scripts"}

[tool.setuptools.package-data]
cognitive_statework = ["schemas/*.json", "schemas/*.yaml"]
