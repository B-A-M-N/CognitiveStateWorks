id: getter
domain: repository_state
purpose: Safely change Git repository state under evidence-backed authorization.
name: Getter
entrypoint: getter/SKILL.md
advisory_entrypoint: SKILL.md
triggers:
- merge
- rebase
- squash
- revert
- cherry-pick
- force push
- reset
- conflict resolution
- repository recovery
phase_tags: [mutation]
inputs:
  required:
  - repository_truth_packet
  optional: []
emits:
- repository_evidence_packet
context_budget: low
exclusive_group: repository_state
handoff: repository_evidence_packet
version: 1.1.0
bundle_schema_version: 2
engine:
  kind: state_machine
  contract: transitions.yaml
  contract_version: state-machine/v1
composition:
  group: repository_state
  mode: exclusive
  requires:
  - gitter
  conflicts: []
contracts:
  packets: contracts/packets.yaml
  evidence: contracts/evidence-kinds.yaml
  schemas:
  - contracts/schemas/repository-evidence-packet.schema.json
  - contracts/schemas/repository-truth-packet.schema.json
integrations:
  cognitiveframeworks:
    required: [fuse, ward]
    enhancements:
    - owl
    - anchor
    - ward
flow_selection:
  fallback: forbidden
  ambiguity: error
  no_match: inactive
