version: "1.1.0"
initial_state: OBSERVED
states:
- OBSERVED
- PLANNED
- CHANGING
- VERIFIED
- RECOVERING
- STABLE
completion_states:
- STABLE
normal_path:
- OBSERVED
- PLANNED
- CHANGING
- VERIFIED
- STABLE
transitions:
- from: OBSERVED
  to: PLANNED
  trigger: plan
  id: getter.observed.plan.planned
  work_class: planning
  domain_effect: authorize_repository_change_plan
  progress_class: FORWARD_PROGRESS
  required_evidence: [intent, risk]
- from: PLANNED
  to: CHANGING
  trigger: mutate
  id: getter.planned.mutate.changing
  work_class: mutation
  domain_effect: begin_repository_change
  progress_class: FORWARD_PROGRESS
  consequential: true
  required_evidence: [authority, rollback]
- from: CHANGING
  to: VERIFIED
  trigger: validate
  id: getter.changing.validate.verified
  work_class: validation
  domain_effect: verify_repository_change
  progress_class: FORWARD_PROGRESS
  consequential: true
  required_evidence: [repository_evidence]
- from: CHANGING
  to: RECOVERING
  trigger: recover
  id: getter.changing.recover.recovering
  work_class: recovery
  domain_effect: enter_repository_recovery
  progress_class: RECOVERY
  required_evidence: [rollback_plan]
- from: VERIFIED
  to: RECOVERING
  trigger: recover
  id: getter.verified.recover.recovering
  work_class: recovery
  domain_effect: enter_repository_recovery
  progress_class: RECOVERY
  required_evidence: [failed_verification]
- from: VERIFIED
  to: STABLE
  trigger: stabilize
  id: getter.verified.stabilize.stable
  work_class: validation
  domain_effect: stabilize_repository_state
  progress_class: TERMINAL
  consequential: true
  required_evidence: [repository_evidence]
- from: VERIFIED
  to: RECOVERING
  trigger: invalidate
  id: getter.verified.invalidate.recovering
  work_class: invalidation
  domain_effect: enter_repository_recovery
  progress_class: INVALIDATION
  required_evidence: [invalidation]
  path_class: invalidation
- from: RECOVERING
  to: OBSERVED
  trigger: observe
  id: getter.recovering.observe.observed
  work_class: observation
  domain_effect: refresh_repository_observation
  progress_class: RECOVERY
  required_evidence: [repository_evidence]
  path_class: recovery
