version: 1.0.0
packets:
  infrastructure_evidence_packet:
    schema: contracts/schemas/infrastructure-evidence-packet.schema.json
    schema_version: 1.1.0
    producer: infrae
    consumers: []
    freshness: immutable
  infrastructure_truth_packet:
    schema: contracts/schemas/infrastructure-truth-packet.schema.json
    schema_version: 1.1.0
    producer: infrae
    consumers:
    - infrae
    freshness:
      strategy: exact_context
      packet_path: payload.freshness_fingerprint
      context_path: infrastructure_fingerprint
    required_context:
    - infrastructure_fingerprint
